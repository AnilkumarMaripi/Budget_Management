<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Smart Budget Planner - Smart Wealth 2.0</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    
    <!-- Material Symbols Outlined -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN for instant styling, custom tokens & dark mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#00685f',
              'primary-container': '#008378',
              'primary-fixed-dim': '#6bd8cb',
              tertiary: '#006947',
              surface: '#f7f9fb',
              'on-surface': '#191c1e',
              'on-surface-variant': '#3d4947',
              outline: '#6d7a77',
              error: '#ba1a1a'
            },
            fontFamily: {
              sans: ['Manrope', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace']
            },
            keyframes: {
              shake: {
                '0%, 100%': { transform: 'translateX(0)' },
                '20%, 60%': { transform: 'translateX(-6px)' },
                '40%, 80%': { transform: 'translateX(6px)' }
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(2px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' }
              }
            },
            animation: {
              shake: 'shake 0.4s ease-in-out',
              fadeIn: 'fadeIn 0.2s ease-out'
            }
          }
        }
      }
    </script>
  </head>
  <body class="bg-[#f7f9fb] dark:bg-[#121517] font-sans text-[#191c1e] dark:text-white min-h-[100dvh] flex flex-col pt-safe pb-safe selection:bg-[#89f5e7] selection:text-[#00201d]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
